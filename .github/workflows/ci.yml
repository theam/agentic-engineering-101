name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Mondays: catch external links that rotted during the week
  workflow_dispatch:

permissions:
  contents: read

jobs:
  structure:
    name: Structure, bilingual parity and relative links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so translation staleness can be detected
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python3 scripts/check_content.py

  markdown:
    name: Markdown style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: DavidAnson/markdownlint-cli2-action@v24
        with:
          globs: "**/*.md"

  practice:
    name: Practice project tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run unit tests
        working-directory: practice/shelf
        run: python -m unittest -v

  links:
    name: External links
    runs-on: ubuntu-latest
    # External sites fail for reasons unrelated to a pull request, so this job
    # informs on PRs and only fails on the weekly scheduled run.
    continue-on-error: ${{ github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --no-progress "**/*.md"
          fail: true
